[project]
name = "python-ds-algorithms"
version = "0.0.1"
requires-python = ">=3.14"

dependencies = []

[dependency-groups]
dev = ["pytest", "ruff>=0.16.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]  # Choose your rule categories
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D211", "D203", "D213", "D400", "D401", "D415"]
extend-ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # Ignore docstring (D) errors in tests

[tool.ruff.format]
quote-style = "double"
