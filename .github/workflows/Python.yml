name: Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
    - name: Install just
        uses: extractions/setup-just@v3
    - name: Setup environment
      run: |
        just sync
    - name: Lint
      run: |
        just lint
    - name: Unit tests
      run: |
        just test